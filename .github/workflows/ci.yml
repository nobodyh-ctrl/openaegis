# CI mínimo (Etapa 13a, D60): tests unitarios sin AWS + chequeo de identificadores reales.
# No tiene credenciales de AWS: no puede leer ni modificar la cuenta.
name: CI

on:
  # Con main protegida (D74), los cambios llegan por PR: el CI corre en cada PR y en cada push a main.
  # Sin el filtro, un push a una rama con PR abierto correría el CI dos veces (push + pull_request).
  push:
    branches: [main]
  pull_request:

# Least privilege para el GITHUB_TOKEN: solo leer el código del repo
permissions:
  contents: read

jobs:
  checks:
    # Este nombre es el check requerido por el ruleset de main (D74): si se cambia acá, hay que cambiarlo allá.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Actions fijadas por commit SHA (inmutable); el comentario indica la versión
      - name: Bajar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no dejar el token guardado en .git/config del runner

      - name: Instalar Python (la misma versión que la Lambda)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Tests unitarios
        run: python -m unittest discover -s tests -v

      - name: Chequeo de identificadores reales
        run: python scripts/check_identifiers.py

      - name: Instalar Node (misma versión que el build de producción)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Typecheck del frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build del frontend
        working-directory: frontend
        run: npm run build

      - name: Audit de dependencias del frontend
        working-directory: frontend
        run: npm audit
