<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenAegis</title>
    <!-- Ícono de la pestaña (SVG, se ve nítido en cualquier tamaño) y de "agregar a pantalla de inicio" en iOS -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Color de la barra del navegador en móviles: el fondo oscuro de la marca -->
    <meta name="theme-color" content="#0b1524" />
  </head>
  <body>
    <!-- Modo oscuro de Cloudscape antes de dibujar (evita el parpadeo claro→oscuro). Va en <body> porque
         Cloudscape define los colores en <body>: la clase tiene que estar ahí, no en <html>. -->
    <script>
      try {
        if (localStorage.getItem("openaegis-theme") !== "light") document.body.classList.add("awsui-dark-mode");
      } catch {
        document.body.classList.add("awsui-dark-mode");
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
